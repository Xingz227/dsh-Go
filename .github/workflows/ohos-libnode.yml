# Builds the HarmonyOS libnode.so together with the LLVM 23.1.1 runtimes it
# statically links, on a Linux runner. This is the part of the HAP that cannot
# be produced on Windows: V8 needs the GNU toolchain and an OpenHarmony sysroot.
#
# Output feeds runtime/ohos/native/build-hap-libs.py --libnode-output.
name: OHOS libnode

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ohos-libnode.yml'
      - 'runtime/ohos/node/**'
      - 'tooling/ohos/prepare-node-fetch.mjs'

permissions:
  contents: read

env:
  SDK_URL: https://repo.huaweicloud.com/openharmony/os/7.0-Release/ohos-sdk-windows_linux-public_20260829.tar.gz
  SDK_SHA: 6bf6ae1efe8de0e8bd15ddbd7fac58bcb54d9620262a541b9b219439317a4c42
  LLVM_SRC_URL: https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.1/llvm-project-23.1.1.src.tar.xz
  LLVM_SRC_SHA: ebe9be46fe8756d58c5b198ffad0fa2a766257add81a4dc52179bfacc7888ee6
  LLVM_BIN_URL: https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.1/LLVM-23.1.1-Linux-X64.tar.xz
  NODE_SRC_URL: https://nodejs.org/dist/v24.22.1/node-v24.22.1.tar.xz
  NODE_SRC_SHA: 4f5379796280cdaeb0c2f358fd04b6a16cc4fb7dfa83b5a8c91a9d963b435231
  NODE_BIN_URL: https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-x64.tar.xz

jobs:
  libnode:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build build-essential python3 python3-dev patch unzip xz-utils pkg-config

      - name: Fetch OpenHarmony SDK (API 26, Linux)
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 5 --max-time 3600 -o /tmp/sdk.tar.gz "$SDK_URL"
          echo "$SDK_SHA  /tmp/sdk.tar.gz" | sha256sum -c -
          mkdir -p /tmp/sdkx && tar -xzf /tmp/sdk.tar.gz -C /tmp/sdkx
          zip="$(find /tmp/sdkx -name 'ets-linux*.zip' | head -1)"
          test -n "$zip"
          dir="$(dirname "$zip")"
          echo "SDK zips in $dir"; ls "$dir"
          mkdir -p "$RUNNER_TEMP/ohos-sdk"
          for z in "$dir"/*.zip; do unzip -q -o "$z" -d "$RUNNER_TEMP/ohos-sdk"; done
          ls "$RUNNER_TEMP/ohos-sdk"
          python3 - <<'PY'
          import json, os
          p = os.path.join(os.environ['RUNNER_TEMP'], 'ohos-sdk/native/oh-uni-package.json')
          d = json.load(open(p))
          print('apiVersion', d['apiVersion'], 'version', d['version'])
          assert d['apiVersion'] == '26', d['apiVersion']
          PY
          df -h /

      - name: Fetch clang 23.1.1
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 5 --max-time 1800 -o /tmp/clang.tar.xz "$LLVM_BIN_URL"
          mkdir -p /opt/clang && tar -xJf /tmp/clang.tar.xz -C /opt/clang --strip-components=1
          /opt/clang/bin/clang --version
          /opt/clang/bin/clang++ --version

      - name: Build LLVM runtimes for aarch64-linux-ohos
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 5 --max-time 1800 -o /tmp/llvm-src.tar.xz "$LLVM_SRC_URL"
          echo "$LLVM_SRC_SHA  /tmp/llvm-src.tar.xz" | sha256sum -c -
          time python3 runtime/ohos/node/build-runtimes.py \
            --sdk-native "$RUNNER_TEMP/ohos-sdk/native" \
            --clang /opt/clang/bin/clang \
            --source-archive /tmp/llvm-src.tar.xz \
            --work "$RUNNER_TEMP/rt-build" \
            --output "$RUNNER_TEMP/rt-out" \
            --jobs 4
          ls "$RUNNER_TEMP/rt-out/lib"

      - name: Build libnode.so
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 5 --max-time 1800 -o /tmp/node-src.tar.xz "$NODE_SRC_URL"
          echo "$NODE_SRC_SHA  /tmp/node-src.tar.xz" | sha256sum -c -
          curl -fL --retry 4 --retry-delay 5 --max-time 1800 -o /tmp/node-bin.tar.xz "$NODE_BIN_URL"
          mkdir -p /opt/node && tar -xJf /tmp/node-bin.tar.xz -C /opt/node --strip-components=1
          export PATH=/opt/node/bin:$PATH
          node --version
          npm --version
          npm ci --ignore-scripts --no-audit --no-fund --prefix runtime/ohos/node/build-tools
          time python3 runtime/ohos/node/build-node.py \
            --sdk-native "$RUNNER_TEMP/ohos-sdk/native" \
            --clang /opt/clang/bin/clang \
            --cxx-runtime "$RUNNER_TEMP/rt-out" \
            --source-archive /tmp/node-src.tar.xz \
            --host-node /opt/node/bin/node \
            --work "$RUNNER_TEMP/node-build" \
            --output "$RUNNER_TEMP/node-out" \
            --jobs 4
          ls -la "$RUNNER_TEMP/node-out"
          cat "$RUNNER_TEMP/node-out/build.json" | head -40

      - name: Report
        if: always()
        run: |
          echo "=== disk ==="; df -h /
          echo "=== node-out ==="; ls -la "$RUNNER_TEMP/node-out" 2>/dev/null || true

      - name: Keep libnode.so
        uses: actions/upload-artifact@v4
        with:
          name: ohos-libnode-${{ github.sha }}
          path: |
            ${{ runner.temp }}/node-out
            ${{ runner.temp }}/rt-out/runtimes.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
