# Assembles the DSH core JS tree for the HAP: two locked npm installs, the
# ohos patch set, the private RE2 build and compose-runtime.py. Needs no SDK and
# no libnode, so it runs in parallel with ohos-libnode.yml.
#
# Output feeds tooling/ohos/check-arkts.sh --full --runtime.
name: OHOS runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ohos-runtime.yml'

permissions:
  contents: read

env:
  NODE_VERSION: 24.22.1
  NODE_SRC_SHA: 4f5379796280cdaeb0c2f358fd04b6a16cc4fb7dfa83b5a8c91a9d963b435231
  NODE_BIN_URL: https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-x64.tar.xz
  NPM_VERSION: 11.9.0

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node ${{ env.NODE_VERSION }}
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 5 -o /tmp/node-bin.tar.xz "$NODE_BIN_URL"
          mkdir -p /opt/node && tar -xJf /tmp/node-bin.tar.xz -C /opt/node --strip-components=1
          echo /opt/node/bin >> "$GITHUB_PATH"
          /opt/node/bin/node --version
          npm install -g "npm@$NPM_VERSION"
          npm --version

      - name: Locked build tools (esbuild 0.27.3)
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix runtime/ohos/node/build-tools

      - name: Pinned re2js 1.3.3 for the private RE2 build
        working-directory: runtime/ohos/process
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund re2js@1.3.3
          node -e "console.log(require('re2js/package.json').version)"

      - name: Prepare composition inputs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-cache"
          time python3 -I -B runtime/ohos/package/prepare-inputs.py \
            --target ohos \
            --node /opt/node/bin/node \
            --npm /opt/node/bin/npm \
            --cache "$RUNNER_TEMP/npm-cache" \
            --out "$RUNNER_TEMP/prepared"
          ls "$RUNNER_TEMP/prepared"
          python3 -c "import json;d=json.load(open('$RUNNER_TEMP/prepared/target-report.json'));print('patches', d.get('selected') and len(d['selected']))"

      - name: Private RE2 build
        run: |
          set -euo pipefail
          node runtime/ohos/process/build-rg-regex.mjs runtime/ohos/node/build-tools
          ls -la runtime/ohos/process/build/
          sha256sum runtime/ohos/process/build/re2js-unicode.mjs

      - name: Compose the runtime zip
        run: |
          set -euo pipefail
          time python3 -I -B runtime/ohos/package/compose-runtime.py \
            --target ohos \
            --dsh-prefix "$RUNNER_TEMP/prepared/dsh" \
            --process-prefix "$RUNNER_TEMP/prepared/process" \
            --target-report "$RUNNER_TEMP/prepared/target-report.json" \
            --prepared-inputs "$RUNNER_TEMP/prepared/prepared-inputs.json" \
            --regex-artifact "runtime/ohos/process/build/re2js-unicode.mjs" \
            --esbuild-prefix "runtime/ohos/node/build-tools" \
            --imports-report "$RUNNER_TEMP/imports-report.json" \
            --out "$RUNNER_TEMP/dsh-runtime-rawfile.zip" \
            --node /opt/node/bin/node \
            --runtime-core "app/ohos/entry/src/main/ets/runtime/RuntimeCore.ets"
          ls -la "$RUNNER_TEMP/dsh-runtime-rawfile.zip"
          sha256sum "$RUNNER_TEMP/dsh-runtime-rawfile.zip"

      - name: Report
        if: always()
        run: |
          df -h /
          ls -la "$RUNNER_TEMP" || true

      - name: Keep the runtime zip
        uses: actions/upload-artifact@v4
        with:
          name: ohos-runtime-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dsh-runtime-rawfile.zip
            ${{ runner.temp }}/imports-report.json
            ${{ runner.temp }}/prepared/target-report.json
            ${{ runner.temp }}/prepared/prepared-inputs.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
